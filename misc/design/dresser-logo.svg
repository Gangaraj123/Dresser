    <!-- T-shirt body -->
    <path d="
      M-40,-48
      L-16,-56
      C-14,-44 -8,-38 0,-38
      C8,-38 14,-44 16,-56
      L40,-48
      L54,-28
      L38,-18
      L38,52
      C38,55 36,57 33,57
      L-33,57
      C-36,57 -38,55 -38,52
      L-38,-18
      L-54,-28
