<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="224" fill="#F0F0F0"/>

  <!-- T-shirt with sparkle cutouts, centered and scaled -->
